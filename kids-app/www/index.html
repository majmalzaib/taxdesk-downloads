<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#8f6bff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Little Stars">
  <meta name="description" content="Little Stars: letters, numbers, colors, shapes, animals and music for little learners.">
  <title>Little Stars</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body data-screen="home">
  <div id="sky" aria-hidden="true">
    <div class="cloud" style="top:12%;animation-duration:48s;animation-delay:-10s"></div>
    <div class="cloud" style="top:38%;animation-duration:64s;animation-delay:-40s;transform:scale(.7)"></div>
    <div class="cloud" style="top:70%;animation-duration:56s;animation-delay:-25s"></div>
  </div>

  <header id="topbar">
    <button id="homeBtn" class="round" aria-label="Home">🏠</button>
    <div id="stars" aria-label="Stars">⭐ <span id="starCount">0</span></div>
    <button id="musicBtn" class="round" aria-label="Background music on or off">🎵</button>
    <button id="voiceBtn" class="round" aria-label="Voice on or off">🗣️</button>
  </header>

  <main id="app"></main>
  <div id="confetti" aria-hidden="true"></div>

  <div id="splash">
    <div id="splashMascot" class="mascot-wrap big"></div>
    <h1>Little Stars</h1>
    <p>Learn · Play · Sing</p>
    <button id="startBtn" class="play-big" aria-label="Start">▶</button>
  </div>

  <script src="audio.js"></script>
  <script src="app.js"></script>
</body>
</html>
