# Builds the Little Stars Android app (APK) and publishes it as a pre-release.
# A pre-release never becomes the repository's "latest" release, so TaxDesk's
# download link (releases/latest) is not affected.
name: Little Stars Android app

on:
  push:
    paths:
      - 'kids-app/**'
      - '.github/workflows/little-stars-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kids-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install

      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: App icon and splash screen
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#8f6bff' --splashBackgroundColor '#8f6bff'

      - name: Build the APK
        working-directory: kids-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../LittleStars.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LittleStars-android
          path: kids-app/LittleStars.apk

      - name: Publish the download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: little-stars
          name: Little Stars (Android app)
          prerelease: true
          make_latest: false
          body: |
            **Little Stars**: a learning and music app for kids.

            **Android:** open this page on the phone, tap `LittleStars.apk` below, open the
            downloaded file, and allow "Install unknown apps" for your browser when asked.
          files: kids-app/LittleStars.apk
